name: Build VirtualCam Tweak (.deb) & APT Repo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tweak:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: |
          brew install ldid

      - name: Fix CRLF line endings
        run: |
          find . -type f \( -name "control" -o -name "Makefile" -o -name "*.plist" -o -name "*.xm" -o -name "*.m" -o -name "*.h" \) \
            -exec sed -i '' 's/\r$//' {} \;

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /tmp/theos
          echo "THEOS=/tmp/theos" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          set -o pipefail
          export THEOS=/tmp/theos
          export THEOS_PACKAGE_SCHEME=rootless

          echo "=== Running make package ==="
          make package FINALPACKAGE=1 2>&1 | tee build.log

          mkdir -p ./output
          find . -name "*.deb" -exec cp {} ./output/VirtualCam.deb \;
          ls -la ./output/

      - name: Create APT Repo files
        run: |
          mkdir -p ./repo
          cp ./output/VirtualCam.deb ./repo/VirtualCam.deb
          
          cat control > ./repo/Packages
          echo "Filename: ./VirtualCam.deb" >> ./repo/Packages
          echo "Size: $(wc -c < ./output/VirtualCam.deb | tr -d ' ')" >> ./repo/Packages
          echo "" >> ./repo/Packages
          
          gzip -c ./repo/Packages > ./repo/Packages.gz
          
          cat << 'EOF' > ./repo/Release
Origin: VirtualCam Repo
Label: VirtualCam
Suite: stable
Version: 1.0
Codename: ios
Architectures: iphoneos-arm64
Components: main
Description: Official VirtualCam Tweak Repository for Sileo
EOF
          
          ls -la ./repo/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-Tweak-deb
          path: ./output/VirtualCam.deb
          retention-days: 30

      - name: Deploy APT Repo to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAT_TOKEN || github.token }}
          publish_dir: ./repo
          force_orphan: true
