name: Build VirtualCam Tweak (.deb)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tweak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl make fakeroot dpkg-dev perl \
            libxml2 libplist-utils xz-utils ca-certificates unzip

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /tmp/theos
          echo "THEOS=/tmp/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          mkdir -p /tmp/theos/sdks
          curl -L "https://github.com/theos/sdks/archive/master.zip" -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks_out
          cp -r /tmp/sdks_out/sdks-master/* /tmp/theos/sdks/ || true
          ls -la /tmp/theos/sdks/

      - name: Build Tweak
        run: |
          export THEOS=/tmp/theos
          export THEOS_PACKAGE_SCHEME=rootless
          export TARGET=iphone:clang:16.5:15.0
          
          echo "=== Running make package ==="
          make package FINALPACKAGE=1 2>&1 | tee build.log
          
          echo "=== Searching for generated .deb files ==="
          mkdir -p ./output
          find . -name "*.deb" -exec cp {} ./output/ \;
          
          echo "Contents of ./output/:"
          ls -la ./output/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-Tweak-deb
          path: ./output/*.deb
          retention-days: 30
